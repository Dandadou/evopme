<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vitrine | Évolution PME</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{--orange:#f7941d;--black:#0d0d0f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--black);color:#f7f7f7;font-family:"Fredoka","Trebuchet MS",Arial,sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0d0f}
.stage:before{content:"";position:absolute;right:-20vw;top:-30vh;width:65vw;height:95vh;border-radius:50%;background:radial-gradient(circle,#f7941d13 0%,transparent 68%);pointer-events:none}
.scene{position:absolute;inset:0;display:grid;grid-template-columns:1.06fr .94fr;align-items:center;gap:4vw;padding:10vh 6vw 16vh;opacity:0;visibility:hidden;transition:opacity .6s ease}
.scene.active{opacity:1;visibility:visible}
.kicker{color:#f7941d;font-size:clamp(15px,1.18vw,24px);font-weight:700;letter-spacing:.11em;margin-bottom:3vh}
h1{font-size:clamp(38px,5.5vw,104px);letter-spacing:-.065em;line-height:.96;margin:0 0 3.7vh;overflow-wrap:break-word;font-weight:700;text-transform:uppercase}
h1 em{color:#f7941d;font-style:normal}
.lead{font-size:clamp(19px,1.6vw,34px);line-height:1.42;max-width:34ch;color:#d0d0d0;margin:0}
.visual{height:60vh;display:flex;align-items:center;justify-content:center;position:relative}
.visual:before{content:"";position:absolute;width:85%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#f7941d24 0%,transparent 68%)}
.visual img{max-width:100%;max-height:100%;object-fit:contain;position:relative}
.visual .emoji{font-size:clamp(90px,16vw,310px);position:relative}
.brand{position:absolute;left:6vw;top:4vh;z-index:5;font-size:clamp(16px,1.7vw,34px);font-weight:700;letter-spacing:-.04em}
.brand strong{color:#f7941d}
.bottom{position:absolute;bottom:3vh;left:6vw;right:6vw;z-index:5;border-top:1px solid #303035;padding-top:2vh;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:clamp(14px,1.25vw,24px);font-weight:600}
.url{color:#f7941d}
.qr-wrap{display:flex;align-items:center;gap:18px}
.qr-wrap[hidden]{display:none!important}
.qr-wrap #qr{width:clamp(86px,8.5vw,145px);height:clamp(86px,8.5vw,145px);background:white;padding:7px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.qr-wrap #qr img,.qr-wrap #qr canvas{display:block;width:100%!important;height:100%!important;object-fit:contain}
@media(max-aspect-ratio:1/1){.scene{grid-template-columns:1fr;padding:12vh 6vw 18vh}.visual{height:32vh}}
@media(prefers-reduced-motion:reduce){.scene{transition:none!important}}
.scene-noel h1{letter-spacing:-.045em;line-height:1.02;text-shadow:2px 3px 0 #5b1720}
.scene-noel h1 em{color:#ffe9c0}
.scene-noel .kicker{color:#b9edc8}
.scene-noel .lead{color:#f8ede4}
.scene-noel{background:radial-gradient(ellipse at 78% 34%,#1e6d4545,transparent 48%)}

/* Direction artistique chaleureuse, en continuité avec le site */
.stage{background:linear-gradient(122deg,#14100d 0%,#221a16 55%,#2b1c13 100%)}
.stage:before{right:-10vw;top:-15vh;width:70vw;height:105vh;background:radial-gradient(circle,#e89a4830 0%,#a4561620 42%,transparent 72%)}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(circle,#ffdfb8 1px,transparent 2px);background-size:66px 68px}
.scene{z-index:2}
.scene.active{z-index:3}
.kicker{color:#ffbd76}
h1{color:#fff4e7;text-shadow:0 5px 28px #0e090877}
h1 em{color:#ffae4d}
.lead{color:#f3e1ce}
.visual:before{background:radial-gradient(circle,#eb994038 0%,#eb994016 44%,transparent 70%)}
.brand{color:#ffeddb}
.brand strong,.url{color:#ffb05b}
.bottom{border-color:#e8bf8d55;color:#f6e9da}
.qr-wrap{background:#fff3e5;color:#283527;border-radius:18px;padding:12px 16px;box-shadow:0 12px 35px #0004}
.qr-wrap #qr{background:#fff;border:5px solid #ffffff;border-radius:9px}
.scene-noel{background:radial-gradient(ellipse at 82% 42%,#246d494d,transparent 55%),linear-gradient(120deg,#14251d,#1f3729 55%,#4b2627 100%)}
.scene-noel .kicker{color:#bde7c7}
.scene-noel h1{color:#fff7e9}
.scene-noel h1 em{color:#fbd4ab}
.scene-noel .lead{color:#f6ede3}
.scene-noel .visual:before{background:radial-gradient(circle,#c69d5540,transparent 70%)}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.snow i{position:absolute;top:-12vh;left:var(--x);width:var(--size);height:var(--size);border-radius:50%;background:#ffffffd9;opacity:var(--opacity);animation:snowfall var(--speed) linear var(--delay) infinite}
@keyframes snowfall{to{transform:translate3d(var(--wind),115vh,0)}}
@media(prefers-reduced-motion:reduce){.snow i{animation:none;display:none}}

/* Enseigne animée : personnalité Évolution PME, adaptée Android TV */
h1{font-family:"Mochiy Pop One","Fredoka",sans-serif;font-size:clamp(31px,4.1vw,78px);font-weight:400;line-height:1.22;letter-spacing:-.04em;max-width:16ch}
.brand{font-family:"Mochiy Pop One","Fredoka",sans-serif;font-weight:400}
.lead{font-weight:600}
.scene .kicker,.scene h1,.scene .lead,.scene .visual{opacity:0;transition:opacity .75s ease,transform .85s ease}
.scene .kicker{transform:translateY(15px)}.scene h1{transform:translateY(26px)}.scene .lead{transform:translateY(34px)}.scene .visual{transform:translateX(36px) scale(.97)}
.scene.active .kicker,.scene.active h1,.scene.active .lead,.scene.active .visual{opacity:1;transform:none}
.scene.active h1{transition-delay:.15s}.scene.active .lead{transition-delay:.29s}.scene.active .visual{transition-delay:.24s}
.scene .visual img{filter:drop-shadow(0 20px 25px #0005)}
.scene.active .visual img,.scene.active .visual .art-badge{animation:float-soft 7s ease-in-out 1s infinite}
@keyframes float-soft{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.scene-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.scene-deco i{position:absolute;top:var(--top);left:var(--left);width:var(--size);height:var(--size);border:2px solid var(--accent,#ffbd80);border-radius:42%;opacity:.2;animation:drift-soft var(--duration) ease-in-out infinite alternate}
.scene-deco i:nth-child(3n){border-radius:50%;background:var(--accent,#ffbd80);opacity:.1}
@keyframes drift-soft{to{transform:translate3d(12px,-17px,0) rotate(28deg)}}
.scene:nth-child(2){background:linear-gradient(115deg,#271811,#46291d 56%,#2d211b)}
.scene:nth-child(3){background:linear-gradient(115deg,#152529,#21413d 56%,#1e292b)}
.scene:nth-child(3) .scene-deco{--accent:#82dec3}
.scene:nth-child(3) h1 em{color:#a1f0d2}
.art-badge{width:min(30vw,455px);height:min(30vw,455px);display:grid;place-items:center;position:relative;border:2px solid #f8d09c88;border-radius:40% 60% 58% 42%;background:linear-gradient(135deg,#e8934130,#ffe2b70b);box-shadow:0 22px 38px #0005}
.art-badge:before{content:"";position:absolute;inset:18px;border:2px dashed #ffffff42;border-radius:50%}
.art-badge span{position:relative;text-align:center;font:400 clamp(26px,3.3vw,60px)/1.3 "Mochiy Pop One","Fredoka",sans-serif;color:#ffe8c9;text-shadow:3px 4px 0 #0004;transform:rotate(-7deg);padding:24px}
.scene-noel .art-badge{background:linear-gradient(140deg,#b5243c,#602735);border-color:#f9d7b3}
.qr-wrap{position:relative;z-index:10;display:flex!important;gap:18px;background:#fff4e5;color:#24402c;padding:12px 16px;border-radius:18px;box-shadow:0 8px 26px #0005;animation:qr-glow 4.5s ease-in-out infinite}
.qr-wrap[hidden]{display:none!important}
.qr-wrap #qr{width:clamp(118px,10.8vw,190px);height:clamp(118px,10.8vw,190px);flex-shrink:0;padding:9px;background:#fff}
.qr-wrap #qr img,.qr-wrap #qr canvas{display:block!important;width:100%!important;height:100%!important}
.qr-wrap #qr img{max-width:none}
.qr-wrap #qr a{color:#17442b}
@keyframes qr-glow{0%,100%{box-shadow:0 8px 26px #0005}50%{box-shadow:0 8px 28px #0005,0 0 22px #ffa94c77}}
@media(prefers-reduced-motion:reduce){.scene .kicker,.scene h1,.scene .lead,.scene .visual{opacity:1;transform:none;transition:none!important}.scene .visual img,.scene .visual .art-badge,.scene-deco i,.qr-wrap{animation:none!important}}

/* Palette officielle : noir, orange vif, accents joyeux */
html,body,.stage{background:#0b0b0f!important}
.stage:before{right:-12vw;top:-25vh;width:73vw;height:110vh;background:radial-gradient(circle,#ff8f192e,transparent 62%)}
.stage:after{opacity:.24;background-image:radial-gradient(circle,#ffb34e 1px,transparent 2px);background-size:59px 65px}
.scene{background:linear-gradient(108deg,#0b0b0f 0%,#15151d 61%,#1c1721 100%)!important}
.scene:nth-child(2){background:radial-gradient(circle at 80% 45%,#ff8b2238,transparent 43%),linear-gradient(115deg,#0b0b0f,#1b1421)!important}
.scene:nth-child(3){background:radial-gradient(circle at 80% 45%,#00b6ac30,transparent 45%),linear-gradient(115deg,#0b0b0f,#15172a)!important}
.scene-noel{background:radial-gradient(circle at 80% 40%,#126b4948,transparent 48%),linear-gradient(110deg,#0b0b0f,#19131e)!important}
.scene .scene-deco{--accent:#ff981f}
.scene:nth-child(2) .scene-deco{--accent:#ff4f86}
.scene:nth-child(3) .scene-deco{--accent:#36d8ca}
.scene-noel .scene-deco{--accent:#75df99}
.scene .kicker{color:#ffa72c}
.scene h1,.brand{color:#fff8ee;text-shadow:none}
.scene h1 em,.brand strong,.url{color:#ff951c}
.scene:nth-child(2) h1 em{color:#ff729b}
.scene:nth-child(3) h1 em{color:#62e7d8}
.scene-noel h1 em{color:#a8efbd}
.scene .lead{color:#efedf1}
.visual:before{background:radial-gradient(circle,#ff8a2230,transparent 70%)}
.art-badge{background:linear-gradient(135deg,#ff8b2238,#f5567e19);border-color:#ffab3d;box-shadow:0 20px 35px #0005}
.art-badge span{color:#fff2d9}
.scene:nth-child(2) .art-badge{background:linear-gradient(135deg,#b62d5a4a,#ff9b3229);border-color:#ff70ac}
.scene:nth-child(3) .art-badge{background:linear-gradient(135deg,#087c744c,#2c5ae23a);border-color:#52e4d5}
.scene-noel .art-badge{background:linear-gradient(135deg,#0b6a4455,#ba284b44);border-color:#83deb2}
.bottom{border-color:#ff951c59;color:#fff5e7;gap:12px}
.qr-wrap{box-sizing:border-box;min-width:0;max-width:min(70vw,430px);overflow:hidden;background:#fff9ef;color:#103b2c;border:2px solid #ff951c;border-radius:16px;padding:8px 10px;gap:10px;animation:none;box-shadow:0 0 22px #ff951c3a}
#qr-label{font-size:clamp(11px,1.45vw,20px);line-height:1.2;font-weight:700;min-width:0;max-width:19ch;overflow-wrap:break-word}
.qr-wrap #qr{box-sizing:border-box;width:clamp(90px,12vw,155px);height:clamp(90px,12vw,155px);min-width:0;max-width:155px;max-height:155px;flex:0 0 auto;overflow:hidden;padding:5px;border:0;border-radius:6px;background:#fff}
.qr-wrap #qr img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain}
@media(max-width:750px){.bottom{left:4vw;right:4vw}.qr-wrap{max-width:73vw;padding:6px 8px;gap:7px}.qr-wrap #qr{width:clamp(80px,16vw,115px);height:clamp(80px,16vw,115px)}#qr-label{font-size:clamp(11px,2vw,15px)}}
</style></head>
<body><main class="stage"><div class="brand">ÉVOLUTION <strong>PME.</strong> <span style="font-size:.45em;letter-spacing:.09em;color:#aaa;vertical-align:middle">CRÉATEUR DE MARQUES</span></div><div id="scenes" aria-live="off"></div><footer class="bottom"><span class="url">evolutionpme.ca</span><div class="qr-wrap" id="qr-wrap" hidden><span id="qr-label">Découvrez nos ateliers</span><div id="qr" role="img" aria-label="Code QR menant à notre site"></div></div></footer></main>
<script src="/assets/qrcode.min.js"></script>
<script>
(()=>{
const defaults=[
{title:"VOS IDÉES. NOS SOLUTIONS. VOTRE ÉVOLUTION.",subtitle:"Nous transformons vos idées en marques fortes et en solutions concrètes.",image:"/assets/%C3%89tiquette%20EVOPME.png",enabled:true},
{title:"DES VÊTEMENTS À VOTRE IMAGE.",subtitle:"T-shirts, cotons ouatés et vêtements corporatifs personnalisés",image:"",enabled:true},
{title:"DES MARQUES QUI SE DÉMARQUENT.",subtitle:"Identité visuelle, graphisme et produits promotionnels",image:"",enabled:true},
{title:"ATELIERS DE NOËL",subtitle:"Venez créer votre chandail de Noël! Inscription en ligne.",image:"",enabled:true}];
const icons=["ÉVOLUTION","CRÉATION","IMPACT","NOËL"];
let slides=defaults,seconds=9,index=0,timer=null,lastPayload="";
const stage=document.getElementById('scenes');
function safeImage(src){try{const u=new URL(src,location.href);return u.origin===location.origin&&(/^\/assets\//.test(u.pathname)||/^\/media\//.test(u.pathname))?u.href:null}catch{return null}}
function build(){stage.replaceChildren();for(let i=0;i<slides.length;i++){const s=slides[i];const item=document.createElement('section');item.className='scene'+(s.position===3?' scene-noel':'');const copy=document.createElement('div');const kicker=document.createElement('div');kicker.className='kicker';kicker.textContent='ÉVOLUTION PME · CRÉATEUR DE MARQUES';const title=document.createElement('h1');const segments=s.title.split('. ').map((v,i,a)=>i<a.length-1?v+'.':v);if(segments.length===3){title.append(document.createTextNode(segments[0]+' '),document.createElement('br'),document.createTextNode(segments[1]+' '),document.createElement('br'));const em=document.createElement('em');em.textContent=segments[2];title.append(em)}else{const words=s.title.split(' ');if(words.length>=3){title.append(document.createTextNode(words.slice(0,-2).join(' ')+' '));const em=document.createElement('em');em.textContent=words.slice(-2).join(' ');title.append(em)}else title.textContent=s.title}const lead=document.createElement('p');lead.className='lead';lead.textContent=s.subtitle;copy.append(kicker,title,lead);const visual=document.createElement('div');visual.className='visual';const url=safeImage(s.image);if(url){const img=document.createElement('img');img.src=url;img.alt='';img.onerror=()=>{img.remove();const e=document.createElement('div');e.className='art-badge';const v=document.createElement('span');v.textContent=icons[s.position]||'ÉVOLUTION';e.append(v);visual.append(e)};visual.append(img)}else{const e=document.createElement('div');e.className='art-badge';const v=document.createElement('span');v.textContent=icons[s.position]||'ÉVOLUTION';e.append(v);visual.append(e)}item.append(copy,visual);const deco=document.createElement('div');deco.className='scene-deco';for(let d=0;d<13;d++){const shape=document.createElement('i');shape.style.setProperty('--top',((d*31+13)%98)+'%');shape.style.setProperty('--left',((d*67+9)%98)+'%');shape.style.setProperty('--size',(11+d%5*10)+'px');shape.style.setProperty('--duration',(7+d%8)+'s');deco.append(shape)}item.append(deco);if(s.position===3){const snow=document.createElement('div');snow.className='snow';for(let n=0;n<34;n++){const flake=document.createElement('i');const seed=(n*37%101)/100;flake.style.setProperty('--x',(n*73%103)+'%');flake.style.setProperty('--size',(2+n%5)+'px');flake.style.setProperty('--opacity',(0.35+(n%6)*.1).toFixed(2));flake.style.setProperty('--speed',(7+n%9)+'s');flake.style.setProperty('--delay',(-n*.63)+'s');flake.style.setProperty('--wind',((n%7-3)*30)+'px');snow.append(flake)}item.append(snow)}stage.append(item)}index=0;show()}
function show(){[...stage.children].forEach((x,i)=>x.classList.toggle('active',i===index))}
function play(){clearInterval(timer);if(slides.length>1)timer=setInterval(()=>{index=(index+1)%slides.length;show()},seconds*1000)}

function updateQR(url,label){
 const wrap=document.getElementById('qr-wrap'),node=document.getElementById('qr');
 let parsed;
 try{parsed=new URL(url||'https://evolutionpme.ca/ateliers-noel.html',location.href);if(!['https:','http:'].includes(parsed.protocol))throw Error('url')}
 catch{parsed=new URL('https://evolutionpme.ca')}
 wrap.hidden=false;
 document.getElementById('qr-label').textContent=label||'Scannez pour découvrir';
 if(node.dataset.value===parsed.href&&node.querySelector('img'))return;
 node.replaceChildren();
 const img=document.createElement('img');img.alt='Code QR à scanner pour ouvrir le lien';
 img.width=220;img.height=220;img.style.cssText='display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain';
 let ready=false;
 try{
  if(typeof QRCode==='function'){
   const temp=document.createElement('div');
   new QRCode(temp,{text:parsed.href,width:220,height:220,colorDark:'#123b2e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
   const canvas=temp.querySelector('canvas');
   if(canvas&&typeof canvas.toDataURL==='function'){
    img.src=canvas.toDataURL('image/png');
    ready=true;
   }else{
    const generated=temp.querySelector('img');
    if(generated&&generated.src){img.src=generated.src;ready=true}
   }
  }
 }catch(e){ready=false}
 if(!ready)img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(parsed.href);
 node.appendChild(img);
 node.dataset.value=parsed.href;
}
async function refresh(){try{const response=await fetch('/api/vitrine',{cache:'no-store'});if(!response.ok)throw Error('offline');const {content:c}=await response.json();if(!c)return;const payload=JSON.stringify(c);if(payload===lastPayload&&stage.children.length)return;lastPayload=payload;const next=defaults.map((d,i)=>({title:String(c['vitrine.slide'+(i+1)+'.title']??d.title).slice(0,125),subtitle:String(c['vitrine.slide'+(i+1)+'.subtitle']??d.subtitle).slice(0,220),image:String(c['vitrine.slide'+(i+1)+'.image']??d.image),enabled:String(c['vitrine.slide'+(i+1)+'.enabled']??'true')!=='false',position:i})).filter(s=>s.enabled);slides=next.length?next:[{...defaults[0],position:0}];seconds=Math.max(5,Math.min(30,Number(c['vitrine.settings.seconds'])||9));const qrUrl=String(c['vitrine.settings.qr_url']||'https://evolutionpme.ca/ateliers-noel.html');updateQR(qrUrl,String(c['vitrine.settings.qr_label']||'Balayez pour découvrir').slice(0,100));build();play()}catch(e){updateQR('https://evolutionpme.ca/ateliers-noel.html','Scannez pour réserver');if(!stage.children.length){slides=defaults.map((s,i)=>({...s,position:i}));build();play()}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
updateQR('https://evolutionpme.ca/ateliers-noel.html','Scannez pour réserver');refresh();setInterval(refresh,60000);
})();
</script></body></html>
