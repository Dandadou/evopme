<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vitrine · Évolution PME</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060708}#screen{position:fixed;inset:0;background:#060708}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s}.slide.active{opacity:1;visibility:visible}.slide iframe{display:block;width:100%;height:100%;border:0}#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;font:600 20px system-ui,sans-serif;text-align:center}#empty small{font-size:13px;font-weight:400;margin-top:10px;opacity:.7}#empty[hidden]{display:none}@media(prefers-reduced-motion:reduce){.slide{transition:none}}</style></head>
<body><main id="screen"><div id="empty">ÉVOLUTION PME<small>Vitrine prête · Ajoutez vos scènes HTML dans le CMS.</small></div></main>
<script>
(()=>{
const screen=document.getElementById('screen'),empty=document.getElementById('empty');
const csp="default-src 'none'; script-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; media-src https: data:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'";
let slides=[],current=-1,timer=null,signature='';
function stop(){if(timer!==null)clearTimeout(timer);timer=null}
function show(index){
 stop();if(!slides.length){empty.hidden=false;return}
 current=(index+slides.length)%slides.length;
 slides.forEach((s,i)=>{s.node.classList.toggle('active',i===current);s.node.setAttribute('aria-hidden',i===current?'false':'true')});
 empty.hidden=true;
 if(slides.length>1)timer=setTimeout(()=>show(current+1),slides[current].seconds*1000)
}
function render(data){
 const oldSlot=slides[current]?.slot,items=[];
 for(let i=1;i<=12;i++){
  const p='vitrine.custom'+i+'.',html=String(data[p+'html']||'');
  if(data[p+'enabled']!=='true'||!html.trim())continue;
  items.push({slot:i,name:String(data[p+'name']||'Scène '+i),html:html.slice(0,5*1024*1024),order:Number(data[p+'order'])||i,seconds:Math.max(5,Math.min(120,Number(data[p+'seconds'])||11))})
 }
 items.sort((a,b)=>a.order-b.order||a.slot-b.slot);
 stop();slides.forEach(s=>s.node.remove());
 slides=items.map(item=>{
  const node=document.createElement('section');node.className='slide';
  const frame=document.createElement('iframe');frame.title=item.name;frame.setAttribute('sandbox','');frame.setAttribute('tabindex','-1');frame.setAttribute('scrolling','no');
  const htmlHead='<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="'+csp+'"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060708;color:white}</style></head><body>';
  frame.srcdoc='<!doctype html>'+htmlHead+item.html+'</body></html>';
  node.append(frame);screen.append(node);return {...item,node}
 });
 show(Math.max(0,slides.findIndex(s=>s.slot===oldSlot)))
}
async function refresh(){
 try{
  const res=await fetch('/api/vitrine?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('API');
  const data=(await res.json()).content||{};
  const next=JSON.stringify(Array.from({length:12},(_,i)=>{const p='vitrine.custom'+(i+1)+'.';return [data[p+'name'],data[p+'html'],data[p+'enabled'],data[p+'order'],data[p+'seconds']]}));
  if(next!==signature){signature=next;render(data)}
 }catch(e){/* Conserver les scènes précédemment chargées. */}
}
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&slides.length)show(current+1);if(e.key==='ArrowLeft'&&slides.length)show(current-1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else{refresh();if(slides.length)show(Math.max(current,0))}});
refresh();setInterval(refresh,30000);
})();
</script></body></html>
